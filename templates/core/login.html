{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="row justify-content-center" style="margin-top: 10vh">
  <div class="col-sm-10 col-md-6 col-lg-4">
    <div class="card">
      <div class="card-header"><h2 class="card-title">Вход в Seller Collector</h2></div>
      <div class="card-body">
        {% if form.errors %}
          <div class="alert alert-danger">Неверный логин или пароль</div>
        {% endif %}
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Логин</label>
            <input class="form-control" type="text" name="username" autofocus required>
          </div>
          <div class="mb-3">
            <label class="form-label">Пароль</label>
            <input class="form-control" type="password" name="password" required>
          </div>
          <input type="hidden" name="next" value="{{ next }}">
          <button class="btn btn-primary w-100" type="submit">Войти</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
