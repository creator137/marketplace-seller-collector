{% extends "base.html" %}
{% block title %}Вход — Seller Collector{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block unauth_content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-sm-10 col-md-6 col-lg-4">
      <div class="text-center mb-4">
        <div class="h2 mb-1">Seller Collector</div>
        <div class="text-secondary">Вход в панель сбора продавцов</div>
      </div>
      <div class="card">
        <div class="card-body p-4">
          {% if form.errors %}
            <div class="alert alert-danger">Неверный логин или пароль</div>
          {% endif %}
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label" for="id_username">Логин</label>
              <input class="form-control" id="id_username" type="text" name="username" autofocus required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="id_password">Пароль</label>
              <input class="form-control" id="id_password" type="password" name="password" required>
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button class="btn btn-primary w-100" type="submit">Войти</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
