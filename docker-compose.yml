services:
  web:
    build: .
    image: marketplace-seller-collector:latest
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://seller:seller@postgres:5432/seller
      REDIS_URL: redis://redis:6379/0
      RQ_ASYNC: "1"
    volumes:
      - ./runtime:/app/runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000
             --worker-class gthread --workers 2 --threads 4 --timeout 60 --keep-alive 5"

  worker:
    image: marketplace-seller-collector:latest
    env_file: .env
    environment:
      DATABASE_URL: postgresql://seller:seller@postgres:5432/seller
      REDIS_URL: redis://redis:6379/0
      RQ_ASYNC: "1"
    volumes:
      - ./runtime:/app/runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    command: python manage.py rqworker default

  scheduler:
    image: marketplace-seller-collector:latest
    env_file: .env
    environment:
      DATABASE_URL: postgresql://seller:seller@postgres:5432/seller
      REDIS_URL: redis://redis:6379/0
      RQ_ASYNC: "1"
    volumes:
      - ./runtime:/app/runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    command: python manage.py auto_collect --loop

  browser-session:
    image: marketplace-seller-collector:latest
    env_file: .env
    environment:
      DISPLAY: ":99"
    volumes:
      - ./runtime:/app/runtime
    ports:
      - "6080:6080"
    expose:
      - "9223"
    restart: unless-stopped
    command: sh /app/scripts/browser_session.sh

  catalog-sync:
    image: marketplace-seller-collector:latest
    env_file: .env
    environment:
      DATABASE_URL: postgresql://seller:seller@postgres:5432/seller
      CATALOG_SYNC_INTERVAL: "86400"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: python manage.py sync_catalogs --loop

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seller
      POSTGRES_PASSWORD: seller
      POSTGRES_DB: seller
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seller"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  pgdata:
